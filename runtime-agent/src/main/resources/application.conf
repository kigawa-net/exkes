ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ net.kigawa.exkes.runtimeagent.ApplicationKt.module ]
    }
}

# The controller sets these in the Runtime Pod (EXKES_AGENT_*). Unset values keep the
# code defaults (stateDir /var/lib/exkes-agent, workingDir = the process cwd).
agent {
    stateDir = "/var/lib/exkes-agent"
    stateDir = ${?EXKES_AGENT_STATE_DIR}
    workingDir = ${?EXKES_AGENT_WORKING_DIR}
}

# Local development stack: MariaDB + exkes-api + exkes-controller.
#
#   docker compose up -d           # everything
#   docker compose up -d mariadb   # DB only (then ./gradlew :exkes-api:run)
#
# Both control plane processes run here: exkes-api writes desired state to the
# DB and answers the API, exkes-controller reconciles those rows into PVCs. They
# are separate Deployments in the cluster too (issue #2 "Controller RBAC": only
# the controller holds Kubernetes permissions).
services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: exkes
      MARIADB_USER: exkes
      MARIADB_PASSWORD: change-this-in-production
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  exkes-api:
    build:
      context: .
      args:
        MODULE: exkes-api
    ports:
      # Host port is overridable (e.g. when 8080 is taken on the host):
      #   EXKES_HTTP_PORT=18080 docker compose up -d
      - "${EXKES_HTTP_PORT:-8080}:8080"
    environment:
      EXKES_DATABASE_JDBC_URL: "jdbc:mariadb://mariadb:3306/exkes"
      EXKES_DATABASE_USER: exkes
      EXKES_DATABASE_PASSWORD: change-this-in-production
    depends_on:
      mariadb:
        condition: service_healthy

  exkes-controller:
    build:
      context: .
      args:
        MODULE: exkes-controller
    ports:
      # The controller also answers /health for probes.
      - "${EXKES_CONTROLLER_HTTP_PORT:-8081}:8080"
    environment:
      EXKES_DATABASE_JDBC_URL: "jdbc:mariadb://mariadb:3306/exkes"
      EXKES_DATABASE_USER: exkes
      EXKES_DATABASE_PASSWORD: change-this-in-production
      # No Kubernetes cluster locally: the controller still starts and /health
      # works, but every PVC call fails, so workspaces move CREATING -> ERROR
      # (exception path) and a Pending/stuck PVC would hit creatingTimeoutSeconds.
      EXKES_KUBERNETES_USE_IN_CLUSTER: "false"
      # Keep it short locally so the CREATING -> ERROR path is observable
      # without waiting 5 minutes.
      EXKES_RECONCILER_INTERVAL_SECONDS: "2"
      EXKES_RECONCILER_MAX_ATTEMPTS: "2"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb-data:

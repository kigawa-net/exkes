# All keys can be overridden with EXKES_<SECTION>_<KEY> environment variables
# (plan chapter 4). Names follow the convention used by exkes-api.
#
# There is no `exkes.kubernetes` / `exkes.reconciler` / `exkes.workspace` section on
# purpose: this process holds no Kubernetes credentials and never reads Workspace
# configuration (issue #2 "Controller RBAC"). It runs no migrations either; the schema
# is owned by exkes-api / exkes-controller.
ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ net.kigawa.exkes.terminalgateway.ApplicationKt.module ]
    }
}

exkes {
    database {
        jdbcUrl = "jdbc:mariadb://localhost:3306/exkes"
        jdbcUrl = ${?EXKES_DATABASE_JDBC_URL}
        user = "exkes"
        user = ${?EXKES_DATABASE_USER}
        password = "change-this-in-production"
        password = ${?EXKES_DATABASE_PASSWORD}
    }
    # Same key and default as exkes-api: a RUNNING runtime is admitted for a Terminal only
    # if the controller observed its Pod Ready within this many seconds.
    admission {
        freshnessSeconds = 15
        freshnessSeconds = ${?EXKES_ADMISSION_FRESHNESS_SECONDS}
    }
    terminalGateway {
        # Where the runtime-agent of a Runtime is reachable. The placeholder {podName} is
        # replaced with runtimes.pod_name (DNS-1123 label, e.g. rt-<runtime id>). The
        # default assumes a Service named after the Pod in the Sandbox namespace; see
        # docs/terminal-gateway.md ("agent の到達先").
        agentUrlTemplate = "ws://{podName}.platform-exkes-stg-sandbox.svc.cluster.local:8080/terminal"
        agentUrlTemplate = ${?EXKES_TERMINAL_GATEWAY_AGENT_URL_TEMPLATE}
        # Time allowed between the WebSocket upgrade and the auth frame.
        authTimeoutSeconds = 10
        authTimeoutSeconds = ${?EXKES_TERMINAL_GATEWAY_AUTH_TIMEOUT_SECONDS}
        # Connection is closed when no frame has been relayed in either direction for this long.
        idleTimeoutSeconds = 900
        idleTimeoutSeconds = ${?EXKES_TERMINAL_GATEWAY_IDLE_TIMEOUT_SECONDS}
        # Hard cap on the lifetime of one connection, independent of the token TTL.
        maxLifetimeSeconds = 3600
        maxLifetimeSeconds = ${?EXKES_TERMINAL_GATEWAY_MAX_LIFETIME_SECONDS}
        # Largest WebSocket message accepted in either direction (bytes, UTF-8 encoded JSON).
        maxMessageBytes = 131072
        maxMessageBytes = ${?EXKES_TERMINAL_GATEWAY_MAX_MESSAGE_BYTES}
    }
}

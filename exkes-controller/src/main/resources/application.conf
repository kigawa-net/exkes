ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ net.kigawa.exkes.controller.ApplicationKt.module ]
    }
}

# All keys can be overridden with EXKES_<SECTION>_<KEY> environment variables
# (plan chapter 4). The names below are the contract used by kigawa-net/platform
# manifests, e.g. EXKES_DATABASE_JDBC_URL / EXKES_KUBERNETES_RESOURCE_NAMESPACE.
exkes {
    database {
        jdbcUrl = "jdbc:mariadb://localhost:3306/exkes"
        jdbcUrl = ${?EXKES_DATABASE_JDBC_URL}
        user = "exkes"
        user = ${?EXKES_DATABASE_USER}
        password = "change-this-in-production"
        password = ${?EXKES_DATABASE_PASSWORD}
    }
    kubernetes {
        namespace = "default"
        namespace = ${?EXKES_KUBERNETES_NAMESPACE}
        # Legacy namespace is used for both PVCs and Pods until both new
        # values are configured in the platform rollout.
        controlNamespace = ${?EXKES_KUBERNETES_CONTROL_NAMESPACE}
        resourceNamespace = ${?EXKES_KUBERNETES_RESOURCE_NAMESPACE}
        # "true" for in-cluster ServiceAccount auth, "false" for local kubeconfig.
        useInCluster = "true"
        useInCluster = ${?EXKES_KUBERNETES_USE_IN_CLUSTER}
        # Empty means ~/.kube/config (only used when useInCluster = false).
        kubeConfigPath = ""
        kubeConfigPath = ${?EXKES_KUBERNETES_KUBECONFIG_PATH}
    }
    workspace {
        storageClass = "rook-cephfs"
        storageClass = ${?EXKES_WORKSPACE_STORAGECLASS}
        # 1Gi in bytes.
        defaultStorageSizeBytes = 1073741824
        defaultStorageSizeBytes = ${?EXKES_WORKSPACE_DEFAULT_STORAGE_SIZE_BYTES}
    }
    runtime {
        # runtime-agent sidecar image (Runtime Pod, second container). The CI tag is
        # harbor.kigawa.net/private/exkes-runtime-agent:main-<sha>; the platform
        # manifest sets it. The default is the pre-existing literal and is only a fallback.
        agentImage = "ghcr.io/kigawa/runtime-agent:latest"
        agentImage = ${?EXKES_RUNTIME_AGENT_IMAGE}
        # Secret in the sandbox namespace used to pull private images (Harbor).
        # Empty string = no imagePullSecrets.
        imagePullSecret = "harbor-registry"
        imagePullSecret = ${?EXKES_RUNTIME_IMAGE_PULL_SECRET}
    }
    reconciler {
        intervalSeconds = 5
        intervalSeconds = ${?EXKES_RECONCILER_INTERVAL_SECONDS}
        # Provisioning failures before a workspace moves to ERROR.
        maxAttempts = 3
        maxAttempts = ${?EXKES_RECONCILER_MAX_ATTEMPTS}
        # A PVC that is accepted but never Bound produces no failure, so the
        # attempt counter alone would keep a workspace in CREATING forever.
        # Measured from workspaces.created_at, so a controller restart does not
        # reset the budget. 0 disables the timeout.
        creatingTimeoutSeconds = 300
        creatingTimeoutSeconds = ${?EXKES_RECONCILER_CREATING_TIMEOUT_SECONDS}
        # A RUNNING runtime whose Pod is NotReady for longer than this moves to
        # DEGRADED (no new Execution is accepted until Ready again). 0 = immediately.
        notReadyGraceSeconds = 30
        notReadyGraceSeconds = ${?EXKES_RECONCILER_NOT_READY_GRACE_SECONDS}
    }
}
